version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx prisma generate
        # Phase 8.8 CI gates — fail the deploy before touching the database.
        # Integration and e2e suites need a disposable database plus browsers,
        # so they run locally / in a dedicated pipeline, not in Amplify.
        - npm run lint
        - npm run lint:tokens
        - npx vitest run --project unit --coverage
        - npx prisma migrate deploy
        - npx prisma db seed
        - env | grep -E '^(AUTH_SECRET|NEXTAUTH_SECRET|NEXTAUTH_URL|DATABASE_URL)=' >> .env.production
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
